[package]
name = "coastercount"
version = "0.3.0"
description = "Coaster-Count Android app (Tauri 2 wrapper around coaster-count.com)"
edition = "2021"
rust-version = "1.77.2"

[lib]
# `_lib` suffix avoids a name clash with the bin target on Windows.
name = "coastercount_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-apk-installer = { path = "plugins/apk-installer" }
serde = { version = "1", features = ["derive"] }
url = "2"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
